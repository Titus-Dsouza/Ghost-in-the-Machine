<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" aria-label="Friendly ghost sticker">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- body -->
  <path d="M30 140 Q 30 60, 100 60 Q 170 60, 170 140 L 170 170 Q 150 185, 130 170 Q 110 185, 90 170 Q 70 185, 50 170 L 30 140 Z" fill="#F4F1FA" filter="url(#glow)" stroke="#C9A7F2" stroke-width="3"/>
  <!-- eyes -->
  <ellipse cx="75" cy="105" rx="9" ry="14" fill="#2D1B4D"/>
  <ellipse cx="125" cy="105" rx="9" ry="14" fill="#2D1B4D"/>
  <!-- smile -->
  <path d="M85 130 Q 100 142, 115 130" fill="none" stroke="#2D1B4D" stroke-width="5" stroke-linecap="round"/>
  <!-- blush -->
  <ellipse cx="62" cy="118" rx="11" ry="7" fill="#FFB52E" opacity="0.55"/>
  <ellipse cx="138" cy="118" rx="11" ry="7" fill="#FFB52E" opacity="0.55"/>
</svg>